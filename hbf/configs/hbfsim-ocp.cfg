# HBFSim configuration corresponding to the `ocp` preset in hbf/configs/parameters.json.
# Every parameter is cross-referenced against hbf/configs/parameters.json and OCP HBF v0.7.0.
#
# Standard & interconnect
hbf-standard=OCP-HBF-0.7.0-2026-08-03
hbm-standard=JEDEC-JESD270-4-2025-04
hbf-processor-interconnect=ucie
# OCP HBF v0.7.0 Table 2/4 Speed Grade 2: 96 GB/s payload per host channel (1,536 GB/s for 16 ch).
# Note: parameters.json assumes 1,024 GB/s core-die aggregate across 32 core channels (64 GB/s per
# host channel); see hbf-channel-bw below.
hbf-speed-grade=2

# Geometry (total = 16 host channels x 4 dies/channel x 16 planes/die = 1,024 planes, 512 GiB)
# Cross-reference with hbf/configs/parameters.json topologies.ocp:
#   channels=32 (16 host channels x 2 core-die channels), chips=2 (2 dies/core channel = 4 dies/host ch),
#   dies=1, planes=16, blocks_per_plane=512, pages_per_block=256, page_bytes=4096.
#
# IMPORTANT upstream HBFSim constraint (src/physical/hbf/hbf_device.cpp:14):
#   HBFSim enforces `channels_per_stack * dies_per_channel <= grade.maximum_dies` (16 for Grade 2,
#   per OCP v0.7.0 Table 2/4 "16 core dies per stack"). Therefore 64 dies (16 host channels x 4 dies)
#   cannot be declared as 1 stack x 16 channels x 4 dies in unmodified HBFSim; instead we factor the
#   16 host channels as 4 stacks x 4 channels/stack x 4 dies/channel x 16 planes/die:
#     - Total channels = 4 * 4 = 16  (exact match; stack * 4 + ch == host_channel in [0..15])
#     - Dies per channel = 4         (exact match to Figure 4's 4 dies per host channel)
#     - Planes per die = 16          (exact match to 16 banks per die)
#     - Total planes = 1,024         (exact match)
#     - Total raw capacity = 512 GiB (exact match)
#     - Total Grade-2 external HBIO bandwidth = 4 * 4 * 96 = 1,536 GB/s (exact 1-stack Grade-2 link)
#     - Physical byte address decode (((((stack*4+ch)*4+die)*16+plane)*512+block)*256+page)*4096 is
#       bit-for-bit identical to 1 stack x 16 ch x 4 die x 16 plane.
hbf-stacks=4
hbf-channels=4
hbf-dies-per-channel=4
hbf-planes-per-die=16
hbf-blocks-per-plane=512
hbf-pages-per-block=256
hbf-page-size=4096

# Media array timings — exact match to hbf/configs/parameters.json (modelling assumptions, SPLASH Table 1)
# parameters.json: read_ns=4096, program_ns=100000, erase_ns=1000000
# (HBFSim upstream defaults are 4000 / 75000 / 2000000 ns)
hbf-read-ns=4096
hbf-program-ns=100000
hbf-erase-ns=1000000

# Internal data path & ECC (HBFSim physical pipeline; not separately modeled in MQSim)
# OOB=224 B/page -> raw codeword = 4,320 B (4096 + 224).
# Core-die aggregate bandwidth in parameters.json is 1,024 GB/s across 16 host channels = 64 GB/s
# payload per host channel -> 64 * (4320 / 4096) = 67.5 GB/s raw codeword rate per channel.
# (HBFSim Grade-2 default is 101.25 GB/s raw = 96 GB/s payload per channel = 1,536 GB/s aggregate.)
hbf-oob-bytes=224
hbf-media-lanes-per-plane=1
hbf-page-buffer-banks-per-plane=2
hbf-channel-bw=67.5
hbf-ecc-decode-latency-ns=500
hbf-ecc-encode-latency-ns=500
hbf-ecc-decode-raw-bw=101.25
hbf-ecc-encode-raw-bw=101.25
hbf-tsv-bw=1644
hbf-media-lane-bw=2048
hbf-logic-sram-bw=2048
hbf-page-buffer-bw=2048

# Raw-physical mode (no host FTL, no write coalescing, no auto-GC, no thermal throttling)
# Matches OCP HBF v0.7.0 section 11.4 (device performs neither GC nor copyback) and our static
# physical placement in hbf/device/address.py.
hbf-mapping-mode=raw-physical
hbf-write-coalescing=false
hbf-write-buffer-pages=0
hbf-write-buffer-flush-threshold-pages=0
hbf-auto-gc-enabled=false
hbf-gc-reserved-free-blocks-per-plane=0
hbf-zone-size-blocks=1
hbf-thermal-enable=false

# Program/erase blocking granularity (hbf/patches/hbfsim/0001-die-blocking.patch):
# false = upstream HBFSim native plane-level blocking (default)
# true  = die-level blocking matching MQSim's `ocp` preset
hbf-die-blocking=false
