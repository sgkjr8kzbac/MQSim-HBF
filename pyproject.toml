[project]
name = "hbf-stage0"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["scale: full-device dense matrix and wall-clock benchmarks"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.scripts]
hbf-stage0 = "hbf.cli:main"

[tool.setuptools]
packages = ["hbf"]

[tool.setuptools.package-data]
hbf = ["mqsim.commit", "configs/*.xml", "configs/*.json", "patches/*.patch", "vendor/*"]
