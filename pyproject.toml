[project]
name = "hbf-stage0"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["scale: full-device dense matrix and wall-clock benchmarks"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project.scripts]
hbf = "hbf.cli:main"
hbf-stage0 = "hbf.cli:main"

[tool.setuptools.packages.find]
include = ["hbf*"]
exclude = ["hbf.mqsim*"]

[tool.setuptools.package-data]
hbf = [
    "mqsim.commit",
    "mqsim.sha256",
    "hbfsim.commit",
    "mqsim/.gitignore",
    "mqsim/*",
    "mqsim/*/*",
    "mqsim/*/*/*",
    "mqsim/*/*/*/*",
    "configs/*.xml",
    "configs/*.json",
    "configs/*.cfg",
    "ext/system/*.json",
    "patches/*.patch",
    "patches/series",
    "patches/hbfsim/*.patch",
    "patches/hbfsim/series",
]
